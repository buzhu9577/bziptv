name: iptv-refresh

on:
  schedule:
    # UTC 19:00 = 北京时间次日 03:00（GitHub 定时任务只认 UTC）
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      deep_top:
        description: "ffprobe 深度复验的源数量（0 = 跳过）"
        required: false
        default: "300"
  # 兜底触发：改代码/源清单/工作流后 push 即跑一次。
  # paths 里不含 result.*，所以机器人自己的提交不会再触发，避免死循环。
  push:
    branches: [main]
    paths:
      - "iptv_hunter.py"
      - "sources.txt"
      - ".github/workflows/iptv.yml"

permissions:
  contents: write

concurrency:
  group: iptv-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 确认 ffmpeg 可用
        run: ffmpeg -version | head -1

      - name: 采集并校验
        env:
          DEEP_TOP: ${{ inputs.deep_top || '300' }}
        run: |
          python iptv_hunter.py \
            --sources sources.txt \
            --out result \
            --workers 48 \
            --timeout 6 \
            --deep-top "$DEEP_TOP"

      - name: 输出统计
        run: |
          echo "### 本次结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 频道数：$(grep -c '^#EXTINF' result.m3u || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件大小：$(du -h result.m3u | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -20 result.report.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iptv-result
          path: |
            result.m3u
            result.txt
            result.report.csv
          retention-days: 7

      - name: 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.m3u result.txt result.report.csv
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 更新 IPTV 源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
